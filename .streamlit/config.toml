[theme]
# Paleta "verde salvia" - tons esverdeados suaves e acolhedores,
# associados a calma, natureza e relaxamento (em vez do azul mais
# corporativo/frio usado antes), para deixar a navegacao mais tranquila.
primaryColor = "#4F6F52"
backgroundColor = "#F6F7F2"
secondaryBackgroundColor = "#EAF2E6"
textColor = "#33403A"
font = "sans serif"

[client]
# Esconde o menu de hamburguer no canto superior direito para deixar
# a interface mais limpa em telas pequenas/celular.
toolbarMode = "minimal"
